name: Release official plugins

on:
  push:
    tags:
      - "plugins-v*"

permissions:
  contents: write

jobs:
  test:
    name: Test official plugins
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test plugins
        run: cargo test --manifest-path official/Cargo.toml --locked

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: darwin-amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build plugins
        run: >-
          cargo build
          --manifest-path official/Cargo.toml
          --locked
          --release
          --target ${{ matrix.target }}

      - name: Package plugins
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for plugin_id in maoyan-rank pansou tmdb-trending subscribe-reminder; do
            version=$(node -p "JSON.parse(require('fs').readFileSync('official/${plugin_id}/plugin.json')).version")
            package_dir="package-${plugin_id}"
            mkdir -p "${package_dir}"
            cp "official/target/${TARGET}/release/${plugin_id}-plugin" "${package_dir}/plugin"
            cp "official/${plugin_id}/plugin.json" "${package_dir}/plugin.json"
            chmod 755 "${package_dir}/plugin"
            file "${package_dir}/plugin"
            tar -C "${package_dir}" -czf \
              "dist/${plugin_id}-v${version}-${PLATFORM}.tar.gz" \
              plugin plugin.json
          done

      - name: Upload platform packages
        uses: actions/upload-artifact@v4
        with:
          name: official-plugins-${{ matrix.platform }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish release and catalog
    needs:
      - test
      - build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all platform packages
        uses: actions/download-artifact@v4
        with:
          pattern: official-plugins-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Publish public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Official plugins ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Load catalog deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.MEDIARY_PLUGINS_DEPLOY_KEY }}

      - name: Trust GitHub SSH host
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Update official catalog entries
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git remote set-url origin git@github.com:KyleYu2024/Mediary-Plugins.git
          git fetch origin main
          git switch main
          node scripts/update-official-catalog.mjs "${RELEASE_TAG}" "${GITHUB_WORKSPACE}/dist"
          node scripts/build-catalog.mjs

          git config user.name "mediary-release[bot]"
          git config user.email "mediary-release[bot]@users.noreply.github.com"
          git add plugins catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish official plugins ${RELEASE_TAG}"
            git push origin main
          fi

name: Validate catalog

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build catalog
        run: node scripts/build-catalog.mjs

      - name: Verify generated catalog is committed
        run: git diff --exit-code catalog.json

      - name: Check documentation links
        run: node scripts/check-doc-links.mjs

[package]
name = "mediary-plugins"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "maoyan-rank-plugin"
path = "src/bin/maoyan-rank-plugin.rs"

[[bin]]
name = "pansou-plugin"
path = "src/bin/pansou-plugin.rs"

[[bin]]
name = "tmdb-trending-plugin"
path = "src/bin/tmdb-trending-plugin.rs"

[[bin]]
name = "subscribe-reminder-plugin"
path = "src/bin/subscribe-reminder-plugin.rs"

[[bin]]
name = "bark-notify-plugin"
path = "src/bin/bark-notify-plugin.rs"

[[bin]]
name = "mcp-server-plugin"
path = "src/bin/mcp-server-plugin.rs"

[[bin]]
name = "115-checkin-plugin"
path = "src/bin/open115-checkin-plugin.rs"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["clock"] }
hex = "0.4"
hmac = "0.12"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.38", features = ["macros", "net", "rt-multi-thread", "sync"] }

[package]
name = "mediary-plugins"
version = "0.1.1"
edition = "2024"

[[bin]]
name = "maoyan-rank-plugin"
path = "src/bin/maoyan-rank-plugin.rs"

[[bin]]
name = "pansou-plugin"
path = "src/bin/pansou-plugin.rs"

[[bin]]
name = "tmdb-trending-plugin"
path = "src/bin/tmdb-trending-plugin.rs"

[[bin]]
name = "subscribe-reminder-plugin"
path = "src/bin/subscribe-reminder-plugin.rs"

[[bin]]
name = "seerr-plugin"
path = "src/bin/seerr-plugin.rs"

[[bin]]
name = "115-checkin-plugin"
path = "src/bin/open115-checkin-plugin.rs"

[[bin]]
name = "smzdm-checkin-plugin"
path = "src/bin/smzdm-checkin-plugin.rs"

[[bin]]
name = "douban-coming-notice-plugin"
path = "src/bin/douban-coming-notice-plugin.rs"

[[bin]]
name = "douban-wish-plugin"
path = "src/bin/douban-wish-plugin.rs"

[[bin]]
name = "pt-site-message-plugin"
path = "src/bin/pt-site-message-plugin.rs"

[[bin]]
name = "telegram-resource-plugin"
path = "src/bin/telegram-resource-plugin.rs"

[dependencies]
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
fs2 = "0.4"
grammers-client = "=0.10.0"
grammers-mtsender = { version = "=0.10.0", features = ["proxy"] }
grammers-session = "=0.10.0"
grammers-tl-types = "=0.10.0"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "socks"] }
quick-xml = { version = "0.41", features = ["serialize"] }
percent-encoding = "2.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.38", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync"] }
